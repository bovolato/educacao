version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sigem_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - sigem_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: sigem_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sigem_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sigem_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: educacao
      MYSQL_USER: sigem
      MYSQL_PASSWORD: password
    volumes:
      - sigem_db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sigem_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sigem_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
      UPLOAD_LIMIT: 100M
    networks:
      - sigem_network
    depends_on:
      - db

networks:
  sigem_network:
    driver: bridge

volumes:
  sigem_db_data:
    driver: local
